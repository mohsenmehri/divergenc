<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetScope Console — DATA MANAGER v28</title>
<style>
/* ================================================================
   NetScope Console — Professional Network Operations UI
   ================================================================ */
:root{
  --bg-0:#070b16;
  --bg-1:#0b1224;
  --bg-2:#0f1830;
  --glass:rgba(148,178,255,.055);
  --glass-2:rgba(148,178,255,.09);
  --stroke:rgba(126,167,255,.14);
  --stroke-2:rgba(126,167,255,.22);
  --txt-0:#eaf1ff;
  --txt-1:#a8b8d4;
  --txt-2:#64748f;
  --cyan:#22d3ee;
  --blue:#3b82f6;
  --indigo:#6366f1;
  --violet:#8b5cf6;
  --green:#22c55e;
  --amber:#f59e0b;
  --red:#ef4444;
  --pink:#ec4899;
  --grad-main:linear-gradient(135deg,#22d3ee 0%,#3b82f6 55%,#6366f1 100%);
  --grad-btn:linear-gradient(135deg,#0ea5e9,#2563eb);
  --grad-green:linear-gradient(135deg,#10b981,#059669);
  --grad-red:linear-gradient(135deg,#f43f5e,#e11d48);
  --grad-amber:linear-gradient(135deg,#fbbf24,#f97316);
  --grad-violet:linear-gradient(135deg,#a78bfa,#7c3aed);
  --shadow-1:0 10px 30px -12px rgba(2,8,23,.65);
  --shadow-2:0 22px 50px -18px rgba(2,8,23,.8);
  --glow-c:0 0 0 1px rgba(34,211,238,.35),0 0 28px -6px rgba(34,211,238,.35);
  --r-lg:18px; --r-md:13px; --r-sm:9px;
  --sidebar-w:264px;
  --topbar-h:62px;
  --font:"Segoe UI",Tahoma,system-ui,-apple-system,"Inter","Vazirmatn",sans-serif;
  --mono:"Cascadia Code","Consolas","JetBrains Mono",monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font);
  background:
    radial-gradient(1100px 520px at 85% -10%,rgba(59,130,246,.16),transparent 60%),
    radial-gradient(900px 480px at 8% 110%,rgba(139,92,246,.13),transparent 55%),
    var(--bg-0);
  color:var(--txt-0);
  font-size:13.5px;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(120,160,255,.055) 1px,transparent 1px);
  background-size:26px 26px;
  mask-image:radial-gradient(1200px 700px at 70% 0%,rgba(0,0,0,.55),transparent 75%);
}
button{font-family:var(--font);cursor:pointer;border:0;background:none;color:inherit;}
input,select,textarea{font-family:var(--font);}
::selection{background:rgba(34,211,238,.35);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:rgba(120,160,255,.22);border-radius:8px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:rgba(120,160,255,.4);background-clip:padding-box;}
::-webkit-scrollbar-track{background:transparent;}

/* ============ LAYOUT ============ */
#layout{display:flex;min-height:100vh;position:relative;z-index:1;}

/* ============ SIDEBAR ============ */
#sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  position:sticky;top:0;height:100vh;
  background:linear-gradient(180deg,rgba(15,24,48,.92),rgba(9,14,30,.96));
  border-left:1px solid var(--stroke);
  display:flex;flex-direction:column;
  backdrop-filter:blur(18px);
  z-index:60;
}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;}
.brand-logo{
  width:42px;height:42px;border-radius:13px;background:var(--grad-main);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px -8px rgba(34,211,238,.55);position:relative;flex:0 0 42px;
}
.brand-logo::after{content:"";position:absolute;inset:-3px;border-radius:16px;
  background:conic-gradient(from 120deg,transparent,rgba(34,211,238,.5),transparent 40%);
  z-index:-1;animation:spin 7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.brand-name{font-size:16px;font-weight:800;letter-spacing:.3px;line-height:1.25;}
.brand-name span{background:var(--grad-main);-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand-sub{font-size:9.5px;color:var(--txt-2);letter-spacing:1.6px;text-transform:uppercase;}
.side-sect{padding:12px 18px 6px;font-size:9.5px;letter-spacing:1.8px;color:var(--txt-2);text-transform:uppercase;font-weight:700;}
.side-nav{display:flex;flex-direction:column;gap:4px;padding:0 11px;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10.5px 13px;border-radius:11px;
  color:var(--txt-1);font-size:12.5px;font-weight:600;cursor:pointer;position:relative;
  transition:.18s;border:1px solid transparent;
}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.85;}
.nav-item:hover{background:var(--glass-2);color:var(--txt-0);transform:translateX(-3px);}
.nav-item.active{
  background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(59,130,246,.08));
  color:#dff6ff;border-color:rgba(34,211,238,.28);
  box-shadow:inset 0 0 24px -10px rgba(34,211,238,.5);
}
.nav-item.active::before{
  content:"";position:absolute;right:-11px;top:18%;height:64%;width:3.5px;border-radius:4px;
  background:var(--grad-main);box-shadow:0 0 12px rgba(34,211,238,.8);
}
.nav-badge{
  margin-right:auto;background:rgba(59,130,246,.22);color:#9cc6ff;font-size:9.5px;
  padding:2px 8px;border-radius:99px;font-weight:700;min-width:26px;text-align:center;
  border:1px solid rgba(59,130,246,.3);
}
.side-foot{margin-top:auto;padding:13px;}
.side-status{
  background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r-md);
  padding:11px 12px;font-size:10.5px;color:var(--txt-1);line-height:2.05;
}
.side-status b{color:var(--txt-0);}
.side-status .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-left:5px;}
.dot.g{background:var(--green);box-shadow:0 0 8px var(--green);}
.dot.c{background:var(--cyan);box-shadow:0 0 8px var(--cyan);}
.dot.a{background:var(--amber);box-shadow:0 0 8px var(--amber);}

/* ============ MAIN ============ */
#main-wrap{flex:1;min-width:0;display:flex;flex-direction:column;}

/* ============ TOPBAR ============ */
#topbar{
  height:var(--topbar-h);position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:13px;padding:0 22px;
  background:rgba(9,14,30,.72);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--stroke);
}
#topbar .page-title{font-size:15px;font-weight:800;letter-spacing:.2px;}
#topbar .page-title small{display:block;font-size:9.5px;color:var(--txt-2);font-weight:600;letter-spacing:1.3px;text-transform:uppercase;}
.top-search{
  display:flex;align-items:center;gap:8px;background:var(--glass);
  border:1px solid var(--stroke);border-radius:99px;padding:7px 14px;width:min(320px,32vw);
  transition:.2s;
}
.top-search:focus-within{border-color:rgba(34,211,238,.5);box-shadow:0 0 0 3px rgba(34,211,238,.12);}
.top-search input{background:none;border:0;outline:none;color:var(--txt-0);width:100%;font-size:12px;}
.top-search svg{width:15px;height:15px;opacity:.55;}
.spacer{flex:1;}
.stat-pill{
  display:flex;align-items:center;gap:7px;background:var(--glass);border:1px solid var(--stroke);
  border-radius:99px;padding:6.5px 13px;font-size:10.5px;color:var(--txt-1);white-space:nowrap;
}
.stat-pill b{color:var(--cyan);font-weight:800;}
.icon-btn{
  width:37px;height:37px;border-radius:11px;background:var(--glass);border:1px solid var(--stroke);
  display:flex;align-items:center;justify-content:center;transition:.18s;position:relative;
}
.icon-btn:hover{background:var(--glass-2);transform:translateY(-1.5px);border-color:var(--stroke-2);}
.icon-btn svg{width:17px;height:17px;opacity:.8;}
.user-chip{
  display:flex;align-items:center;gap:9px;background:var(--glass);border:1px solid var(--stroke);
  border-radius:99px;padding:5px 6px 5px 14px;
}
.avatar{
  width:31px;height:31px;border-radius:50%;background:var(--grad-main);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#04101f;
}
.user-chip .un{font-size:11px;font-weight:700;}
.user-chip .ur{font-size:9px;color:var(--txt-2);display:block;}

/* ============ VIEWS ============ */
.view{display:none;flex:1;flex-direction:column;min-width:0;}
.view.active{display:flex;}
.content{padding:20px 22px 34px;display:flex;flex-direction:column;gap:18px;}

/* ============ CARDS ============ */
.card{
  background:linear-gradient(160deg,rgba(148,178,255,.075),rgba(148,178,255,.028));
  border:1px solid var(--stroke);border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);position:relative;overflow:hidden;
  transition:.22s;
}
.card:hover{border-color:var(--stroke-2);}
.card-head{display:flex;align-items:center;gap:10px;padding:15px 18px 0;}
.card-head .ico{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  flex:0 0 34px;
}
.card-head .ico svg{width:17px;height:17px;}
.card-head h3{margin:0;font-size:13px;font-weight:800;}
.card-head .eyebrow{font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--txt-2);font-weight:700;}
.card-body{padding:14px 18px 18px;}
.g-cyan{background:rgba(34,211,238,.14);color:var(--cyan);}
.g-green{background:rgba(34,197,94,.14);color:var(--green);}
.g-red{background:rgba(239,68,68,.14);color:var(--red);}
.g-amber{background:rgba(245,158,11,.14);color:var(--amber);}
.g-violet{background:rgba(139,92,246,.14);color:var(--violet);}
.g-blue{background:rgba(59,130,246,.14);color:var(--blue);}

/* ============ HERO ============ */
.hero{
  border-radius:var(--r-lg);position:relative;overflow:hidden;
  background:linear-gradient(120deg,rgba(34,211,238,.13),rgba(59,130,246,.1) 45%,rgba(139,92,246,.12));
  border:1px solid rgba(34,211,238,.22);
  display:flex;align-items:center;gap:22px;padding:26px 28px;
  box-shadow:var(--shadow-1);
}
.hero::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(500px 240px at 92% 0%,rgba(34,211,238,.2),transparent 60%),
    radial-gradient(420px 240px at 4% 110%,rgba(139,92,246,.18),transparent 60%);
}
.hero-net{position:absolute;left:0;top:0;height:100%;width:44%;opacity:.85;}
.hero-txt{position:relative;flex:1;}
.hero-tag{
  display:inline-flex;align-items:center;gap:7px;background:rgba(34,211,238,.14);
  border:1px solid rgba(34,211,238,.3);color:#a5f3fc;font-size:10px;font-weight:700;
  letter-spacing:1.2px;padding:5px 12px;border-radius:99px;text-transform:uppercase;
}
.hero h1{margin:12px 0 7px;font-size:23px;font-weight:900;letter-spacing:.2px;line-height:1.5;}
.hero h1 em{
  font-style:normal;background:var(--grad-main);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{margin:0;color:var(--txt-1);font-size:12.5px;line-height:2.1;max-width:640px;}
.hero-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:11px;
  font-size:12px;font-weight:800;color:#fff;position:relative;overflow:hidden;
  transition:.18s;letter-spacing:.2px;
}
.btn svg{width:15px;height:15px;}
.btn::after{
  content:"";position:absolute;top:0;left:-80%;width:55%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);
  transform:skewX(-22deg);transition:.5s;
}
.btn:hover::after{left:130%;}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--grad-btn);box-shadow:0 10px 24px -10px rgba(37,99,235,.65);}
.btn-green{background:var(--grad-green);box-shadow:0 10px 24px -10px rgba(5,150,105,.6);}
.btn-red{background:var(--grad-red);box-shadow:0 10px 24px -10px rgba(225,29,72,.55);}
.btn-amber{background:var(--grad-amber);box-shadow:0 10px 24px -10px rgba(249,115,22,.55);}
.btn-violet{background:var(--grad-violet);box-shadow:0 10px 24px -10px rgba(124,58,237,.55);}
.btn-ghost{
  background:var(--glass);border:1px solid var(--stroke-2);color:var(--txt-0);
}
.btn-ghost:hover{background:var(--glass-2);}
.btn-cyan{background:linear-gradient(135deg,#22d3ee,#0284c7);box-shadow:0 10px 24px -10px rgba(14,165,233,.6);}
.btn-sm{padding:7px 13px;font-size:11px;border-radius:9px;}
.btn-block{width:100%;justify-content:center;}

/* ============ FORM CONTROLS ============ */
.field{display:flex;flex-direction:column;gap:6px;}
.field label{
  font-size:10px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--txt-2);
  display:flex;align-items:center;gap:7px;
}
.field label .ref{
  font-family:var(--mono);font-size:8.5px;background:rgba(34,211,238,.12);color:#67e8f9;
  padding:1.5px 7px;border-radius:5px;letter-spacing:.5px;border:1px solid rgba(34,211,238,.22);
}
.inp, select.inp{
  height:42px;border-radius:11px;border:1px solid var(--stroke-2);
  background:rgba(2,10,27,.55);color:var(--txt-0);padding:0 14px;font-size:12.5px;
  outline:none;transition:.18s;width:100%;
}
.inp:focus{border-color:rgba(34,211,238,.65);box-shadow:0 0 0 3.5px rgba(34,211,238,.13);background:rgba(2,10,27,.8);}
select.inp{
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,#7aa7e8 50%),linear-gradient(135deg,#7aa7e8 50%,transparent 50%);
  background-position:calc(0% + 18px) calc(50% + 1px),calc(0% + 24px) calc(50% + 1px);
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;
}
select.inp option{background:#0d1730;color:#eaf1ff;}

/* exact toggle */
.exact-wrap{display:flex;align-items:center;gap:11px;padding:2px 1px;}
.switch{
  width:64px;height:28px;border-radius:99px;position:relative;cursor:pointer;transition:.25s;flex:0 0 64px;
  background:rgba(239,68,68,.75);border:1px solid rgba(239,68,68,.5);
}
.switch.on{background:rgba(34,197,94,.8);border-color:rgba(34,197,94,.55);box-shadow:0 0 18px -4px rgba(34,197,94,.55);}
.switch .thumb{
  position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s;
  box-shadow:0 2px 8px rgba(0,0,0,.4);right:calc(100% - 23px);
}
.switch.on .thumb{right:3px;}
.switch .txt{
  position:absolute;top:5px;width:100%;text-align:center;font-size:9px;font-weight:900;
  color:#fff;direction:ltr;user-select:none;letter-spacing:.8px;
}
.exact-label{font-size:11px;font-weight:700;color:var(--txt-1);}

/* ============ KPI ============ */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:15px;}
.kpi{
  background:linear-gradient(160deg,rgba(148,178,255,.09),rgba(148,178,255,.025));
  border:1px solid var(--stroke);border-radius:var(--r-md);padding:16px 17px;
  position:relative;overflow:hidden;transition:.2s;
}
.kpi:hover{transform:translateY(-3px);border-color:var(--stroke-2);box-shadow:var(--shadow-1);}
.kpi .k-ico{
  position:absolute;left:13px;top:13px;width:36px;height:36px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;opacity:.95;
}
.kpi .k-ico svg{width:17px;height:17px;}
.kpi .k-val{font-size:25px;font-weight:900;letter-spacing:-.5px;line-height:1.25;}
.kpi .k-val small{font-size:11px;font-weight:700;color:var(--txt-2);}
.kpi .k-lbl{font-size:10.5px;color:var(--txt-1);font-weight:600;margin-top:3px;}
.kpi .k-trend{
  display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;
  padding:2.5px 9px;border-radius:99px;margin-top:9px;
}
.k-trend.up{background:rgba(34,197,94,.14);color:#6ee7b7;}
.k-trend.info{background:rgba(34,211,238,.14);color:#67e8f9;}
.k-trend.warn{background:rgba(245,158,11,.16);color:#fcd34d;}
.k-trend.idle{background:rgba(148,163,184,.15);color:#94a3b8;}
.kpi::after{
  content:"";position:absolute;inset:auto -30% -60% -30%;height:70%;
  background:radial-gradient(closest-side,rgba(34,211,238,.16),transparent);
}

/* ============ GRID HELPERS ============ */
.grid-2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.grid-add{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px;}
@media (max-width:1180px){.grid-2,.grid-3,.grid-add{grid-template-columns:1fr;}}

/* ============ SEARCH CARD ============ */
.search-rows{display:grid;grid-template-columns:1.3fr 1fr;gap:13px;}
.search-value-row{display:flex;gap:11px;align-items:flex-end;}
.search-value-row .field{flex:1;}
.dash-note{
  margin-top:12px;padding:10px 13px;border-radius:var(--r-sm);font-size:10.5px;line-height:2;
  background:rgba(34,211,238,.07);border:1px dashed rgba(34,211,238,.28);color:#9fe8f5;
}

/* ============ TOOLS GRID ============ */
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:9px;}
.tool-tile{
  background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r-sm);
  padding:11px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;
  cursor:pointer;transition:.17s;text-align:center;
}
.tool-tile:hover{background:var(--glass-2);transform:translateY(-2.5px);border-color:var(--stroke-2);}
.tool-tile svg{width:18px;height:18px;opacity:.9;}
.tool-tile span{font-size:9.5px;font-weight:700;color:var(--txt-1);line-height:1.6;}
.icon-btn.accent{border-color:rgba(34,211,238,.45);color:#22d3ee;background:rgba(34,211,238,.10);}
.icon-btn.accent:hover{background:rgba(34,211,238,.18);border-color:rgba(34,211,238,.7);}
.tool-tile.wide{grid-column:span 2;}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:56px 28px;text-align:center;border:1.5px dashed var(--stroke-2);border-radius:18px;
  background:rgba(148,178,255,.045);grid-column:1/-1;}
.empty-state .es-ico{width:74px;height:74px;display:flex;align-items:center;justify-content:center;
  border-radius:22px;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.35);}
.empty-state .es-ico svg{width:34px;height:34px;}
.empty-state h3{font-size:17px;color:var(--txt-0);margin:0;}
.empty-state p{font-size:12.5px;color:var(--txt-2);max-width:520px;line-height:2;margin:0;}
#dash-cats:has(.empty-state){display:block;}
.sec-note{font-size:9.5px;color:#fbbf24;background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.30);
  border-radius:8px;padding:5px 10px;margin-top:8px;line-height:1.9;}

/* ============ ACTION CARD ============ */
.action-card .card-body{display:flex;flex-direction:column;gap:11px;}
.mini-label{font-size:10px;color:var(--txt-2);font-weight:700;letter-spacing:.8px;}

/* ============ CHARTS ============ */
.donut-wrap{display:flex;align-items:center;gap:16px;}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:6px;font-size:10.5px;}
.donut-legend .li{display:flex;align-items:center;gap:7px;color:var(--txt-1);}
.donut-legend .sw{width:9px;height:9px;border-radius:3px;flex:0 0 9px;}
.donut-legend .vv{margin-right:auto;font-family:var(--mono);color:var(--txt-0);font-size:10px;}
.bars{display:flex;flex-direction:column;gap:9px;}
.bar-row{display:flex;align-items:center;gap:9px;font-size:10.5px;}
.bar-row .nm{width:118px;text-align:left;color:var(--txt-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-row .tr{flex:1;height:8px;border-radius:99px;background:rgba(120,160,255,.1);overflow:hidden;}
.bar-row .fl{height:100%;border-radius:99px;background:var(--grad-main);box-shadow:0 0 10px -2px rgba(34,211,238,.6);}
.bar-row .vv{font-family:var(--mono);font-size:9.5px;color:var(--txt-2);width:34px;text-align:left;}

/* ============ ACTIVITY FEED ============ */
.feed{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto;}
.feed-item{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-radius:9px;}
.feed-item:hover{background:var(--glass);}
.feed-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:0 0 8px;}
.feed-item .ft{font-size:11px;line-height:1.75;flex:1;}
.feed-item .ft b{color:var(--txt-0);}
.feed-item .fd{font-family:var(--mono);font-size:8.5px;color:var(--txt-2);white-space:nowrap;margin-top:2px;}

/* ============ VIEW HEAD (results/sheet/log/macros) ============ */
.view-head{
  display:flex;align-items:center;gap:11px;flex-wrap:wrap;
  padding:15px 22px 0;
}
.view-head h2{margin:0;font-size:16px;font-weight:800;}
.view-head .sub{font-size:10.5px;color:var(--txt-2);}
.view-head .title-ico{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
}
.view-head .title-ico svg{width:18px;height:18px;}
.head-actions{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap;}

/* ============ MATCH BLOCKS (results) ============ */
.match-block{margin-bottom:16px;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.match-title{
  background:linear-gradient(120deg,rgba(59,130,246,.24),rgba(34,211,238,.13));
  border:1px solid rgba(59,130,246,.35);border-bottom:0;color:#cfe4ff;
  font-weight:800;font-size:11.5px;padding:9px 14px;border-radius:var(--r-md) var(--r-md) 0 0;
  direction:ltr;text-align:left;font-family:var(--mono);letter-spacing:.2px;
  display:flex;align-items:center;gap:9px;
}
.match-title .tag{
  background:rgba(34,211,238,.2);border:1px solid rgba(34,211,238,.35);color:#7dd3fc;
  padding:1.5px 9px;border-radius:99px;font-size:8.5px;font-family:var(--font);
}
.match-block.remove .match-title{
  background:linear-gradient(120deg,rgba(239,68,68,.26),rgba(244,63,94,.12));
  border-color:rgba(239,68,68,.4);color:#fecdd3;
}
.block-scroll{overflow-x:auto;border:1px solid var(--stroke);border-top:0;border-radius:0 0 var(--r-md) var(--r-md);}
table.block-table{border-collapse:collapse;width:100%;min-width:640px;}
.block-table th{
  background:rgba(30,58,110,.45);font-size:9.5px;font-weight:800;padding:8px 10px;
  border-bottom:1px solid var(--stroke);white-space:nowrap;text-align:center;color:#b9cdf0;
  letter-spacing:.4px;position:sticky;top:0;
}
.block-table td{border-bottom:1px solid rgba(126,167,255,.08);padding:0;}
.block-table tr:hover td{background:rgba(59,130,246,.06);}
.block-table td .cell-in{
  width:100%;border:0;outline:none;padding:8px 10px;font-size:11px;background:transparent;
  color:var(--txt-0);min-width:84px;
}
.block-table td .cell-in:focus{background:rgba(250,204,21,.1);box-shadow:inset 0 0 0 1.5px rgba(250,204,21,.5);}
.block-table td.saved{background:rgba(250,204,21,.14);}
.block-sep{height:5px;}

/* ============ SHEET CHIPS + GRID ============ */
.chip-bar{display:flex;flex-wrap:wrap;gap:7px;}
.sheet-chip{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--glass);border:1px solid var(--stroke);color:var(--txt-1);
  border-radius:99px;padding:5.5px 13px;font-size:10.5px;cursor:pointer;transition:.16s;font-weight:600;
}
.sheet-chip:hover{background:var(--glass-2);color:var(--txt-0);transform:translateY(-1.5px);}
.sheet-chip.active{background:rgba(34,211,238,.16);border-color:rgba(34,211,238,.45);color:#a5f3fc;}
.sheet-chip.sys{opacity:.55;}
.grid-wrap{
  overflow:auto;border:1px solid var(--stroke);border-radius:var(--r-md);
  background:rgba(2,10,27,.4);max-height:calc(100vh - 300px);
}
table.xl{border-collapse:separate;border-spacing:0;min-width:100%;}
table.xl th,table.xl td{
  border-left:1px solid rgba(126,167,255,.08);
  border-bottom:1px solid rgba(126,167,255,.08);
  padding:7px 11px;font-size:10.5px;white-space:nowrap;max-width:300px;
  overflow:hidden;text-overflow:ellipsis;
}
table.xl thead th{
  background:linear-gradient(180deg,rgba(30,58,130,.6),rgba(22,42,92,.6));
  color:#c4d7f7;font-size:9.5px;font-weight:800;letter-spacing:.4px;position:sticky;top:0;z-index:3;
}
table.xl .rn{
  background:rgba(15,23,55,.85);color:var(--txt-2);font-weight:700;position:sticky;right:0;z-index:2;
  min-width:44px;text-align:center;direction:ltr;font-family:var(--mono);font-size:9px;
}
table.xl thead .rn{background:rgba(18,32,72,.95);z-index:4;}
table.xl tbody tr:hover td{background:rgba(59,130,246,.08);}
table.xl td[contenteditable]{cursor:text;}
table.xl td[contenteditable]:focus{outline:none;background:rgba(250,204,21,.12);box-shadow:inset 0 0 0 1.5px rgba(250,204,21,.5);}

/* ============ LOG TABLE ============ */
.logtable{border-collapse:separate;border-spacing:0;width:100%;}
.logtable th{
  background:linear-gradient(180deg,rgba(30,58,130,.55),rgba(22,42,92,.55));
  color:#c4d7f7;font-size:9.5px;font-weight:800;padding:9px 12px;text-align:right;
  position:sticky;top:0;letter-spacing:.5px;
}
.logtable td{border-bottom:1px solid rgba(126,167,255,.08);padding:8px 12px;font-size:10.5px;color:var(--txt-1);}
.logtable tr:hover td{background:rgba(59,130,246,.06);}
.logtable tr.err td{background:rgba(239,68,68,.09);}
.act-badge{
  display:inline-block;padding:2.5px 10px;border-radius:99px;font-size:8.5px;font-weight:800;letter-spacing:.5px;
}
.act-ADD{background:rgba(34,197,94,.16);color:#6ee7b7;}
.act-REMOVE{background:rgba(239,68,68,.16);color:#fca5a5;}
.act-UNDO{background:rgba(245,158,11,.16);color:#fcd34d;}
.act-EDIT{background:rgba(59,130,246,.16);color:#93c5fd;}
.act-ERROR,.act-ARCHIVE_FAIL{background:rgba(239,68,68,.2);color:#fecaca;}
.act-default{background:rgba(148,163,184,.15);color:#cbd5e1;}

/* ============ NAVIGATOR CARDS ============ */
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:11px;}
.nav-card{
  border-radius:12px;padding:13px 14px;cursor:pointer;font-size:11.5px;font-weight:700;
  display:flex;align-items:center;gap:10px;transition:.17s;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
}
.nav-card::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(120deg,rgba(255,255,255,.14),transparent 45%);opacity:0;transition:.2s;
}
.nav-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -12px rgba(2,8,23,.8);}
.nav-card:hover::after{opacity:1;}
.nav-card .num{
  background:rgba(255,255,255,.2);border-radius:8px;width:25px;height:25px;display:flex;
  align-items:center;justify-content:center;font-size:9px;flex:0 0 25px;font-family:var(--mono);
}
.nav-card .rows{margin-right:auto;font-size:9px;opacity:.8;font-family:var(--mono);}

/* ============ MACROS ============ */
.macro-mod{
  background:linear-gradient(160deg,rgba(148,178,255,.075),rgba(148,178,255,.025));
  border:1px solid var(--stroke);border-radius:var(--r-md);overflow:hidden;
}
.macro-mod .mh{
  display:flex;align-items:center;gap:10px;padding:11px 15px;
  background:rgba(30,58,130,.28);border-bottom:1px solid var(--stroke);
}
.macro-mod .mh .nm{font-family:var(--mono);font-size:11px;font-weight:800;color:#9cc6ff;direction:ltr;}
.macro-mod .mh .cnt{
  background:rgba(34,211,238,.14);border:1px solid rgba(34,211,238,.3);color:#7dd3fc;
  border-radius:99px;font-size:9px;padding:2px 10px;font-weight:800;
}
.macro-item{display:flex;align-items:center;gap:11px;padding:8.5px 15px;border-bottom:1px solid rgba(126,167,255,.06);transition:.14s;}
.macro-item:hover{background:rgba(59,130,246,.07);}
.macro-item .mnm{font-family:var(--mono);font-size:10.5px;font-weight:700;color:#8ab6ff;min-width:186px;direction:ltr;}
.macro-item .mds{flex:1;font-size:10.5px;color:var(--txt-1);}
.macro-run{
  background:rgba(34,211,238,.13);border:1px solid rgba(34,211,238,.3);color:#7dd3fc;
  padding:5px 13px;border-radius:8px;font-size:10px;font-weight:800;transition:.15s;
}
.macro-run:hover{background:rgba(34,211,238,.25);transform:translateY(-1px);}
.macro-dl{
  background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.25);color:#cbd5e1;
  padding:5px 10px;border-radius:8px;font-size:10px;font-weight:800;
}

/* ============ WIZARD FORM ============ */
.wizard-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.wf{
  background:rgba(2,10,27,.5);border:1px solid var(--stroke);border-radius:10px;padding:8px 11px;
}
.wf label{display:block;font-size:9.5px;color:#7da3d8;font-weight:800;margin-bottom:4px;letter-spacing:.4px;}
.wf input{
  width:100%;height:31px;border:1px solid rgba(126,167,255,.22);border-radius:8px;
  padding:2px 10px;font-size:11px;background:rgba(2,10,27,.6);color:var(--txt-0);outline:none;
}
.wf input:focus{border-color:rgba(34,211,238,.6);box-shadow:0 0 0 3px rgba(34,211,238,.12);}
.section-pick{display:flex;gap:11px;justify-content:center;padding:10px 0;}
.section-pick button{
  border-radius:11px;padding:12px 26px;font-size:12.5px;font-weight:800;color:#fff;
  transition:.17s;box-shadow:0 10px 22px -10px rgba(2,8,23,.8);
}
.section-pick button:hover{transform:translateY(-2.5px);filter:brightness(1.12);}
.section-pick .br{background:var(--grad-green);}
.section-pick .atm{background:var(--grad-btn);}
.section-pick .cn{background:var(--grad-red);}

/* ============ MODAL ============ */
#modal-overlay{
  position:fixed;inset:0;background:rgba(3,7,18,.72);backdrop-filter:blur(7px);
  z-index:2000;display:none;align-items:center;justify-content:center;padding:18px;
}
#modal-overlay.show{display:flex;}
.mbox{
  background:linear-gradient(165deg,#121d3a,#0c1428);
  border:1px solid rgba(126,167,255,.2);border-radius:17px;
  min-width:330px;max-width:660px;width:94%;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.75);overflow:hidden;
  animation:pop .22s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{transform:scale(.92) translateY(12px);opacity:0}to{transform:scale(1);opacity:1}}
.mbox .t{
  display:flex;align-items:center;gap:10px;padding:13px 18px;font-weight:800;font-size:13px;
  background:rgba(30,58,130,.4);border-bottom:1px solid var(--stroke);
}
.mbox .t::before{
  content:"";width:10px;height:10px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 12px var(--cyan);flex:0 0 10px;
}
.mbox.err .t::before{background:var(--red);box-shadow:0 0 12px var(--red);}
.mbox.warn .t::before{background:var(--amber);box-shadow:0 0 12px var(--amber);}
.mbox.q .t::before{background:var(--violet);box-shadow:0 0 12px var(--violet);}
.mbox .t .x{margin-right:auto;cursor:pointer;opacity:.65;font-size:15px;}
.mbox .t .x:hover{opacity:1;}
.mbox .c{padding:17px 20px;font-size:12.5px;line-height:2.15;white-space:pre-wrap;max-height:58vh;overflow:auto;color:#d7e3fa;}
.mbox .f{padding:12px 18px;display:flex;gap:9px;}
.mbox .f button{border-radius:10px;padding:9px 24px;font-size:12px;font-weight:800;color:#fff;transition:.15s;}
.mbox .f button:hover{transform:translateY(-1.5px);filter:brightness(1.12);}
.mbox .f .yes{background:var(--grad-green);}
.mbox .f .no{background:var(--grad-btn);}
.mbox .f .cancel{background:var(--grad-red);}
.mbox .f .ok{background:var(--grad-btn);}
.mbox input.m-in{
  width:100%;height:42px;border:1px solid rgba(126,167,255,.3);border-radius:11px;
  padding:4px 14px;font-size:13px;direction:rtl;margin-top:11px;
  background:rgba(2,10,27,.6);color:var(--txt-0);outline:none;
}
.mbox input.m-in:focus{border-color:rgba(34,211,238,.6);box-shadow:0 0 0 3.5px rgba(34,211,238,.13);}

/* ============ TOASTS ============ */
#toasts{position:fixed;bottom:22px;left:22px;z-index:3000;display:flex;flex-direction:column;gap:9px;}
.toast{
  background:linear-gradient(165deg,#132043,#0d1830);color:#e6eeff;
  border:1px solid rgba(126,167,255,.25);border-radius:12px;padding:11px 17px;font-size:11.5px;
  box-shadow:0 16px 40px -12px rgba(0,0,0,.7);animation:slidein .28s ease;max-width:390px;
  display:flex;align-items:center;gap:10px;
}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);flex:0 0 8px;}
.toast.ok::before{background:var(--green);box-shadow:0 0 10px var(--green);}
.toast.err::before{background:var(--red);box-shadow:0 0 10px var(--red);}
.toast.warn::before{background:var(--amber);box-shadow:0 0 10px var(--amber);}
@keyframes slidein{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

/* ============ MISC ============ */
.empty-state{
  text-align:center;padding:52px 12px;color:var(--txt-2);font-size:12.5px;line-height:2.3;
}
.empty-state svg{width:46px;height:46px;opacity:.35;margin-bottom:10px;}
.hint{font-size:10px;color:var(--txt-2);line-height:2;}
.rtl-num{direction:ltr;unicode-bidi:embed;}
.mono{font-family:var(--mono);}
.badge-soft{
  display:inline-flex;align-items:center;gap:5px;background:rgba(34,211,238,.12);
  border:1px solid rgba(34,211,238,.28);color:#7dd3fc;border-radius:99px;
  padding:2px 10px;font-size:9.5px;font-weight:800;
}
.legend-strip{
  display:flex;gap:14px;flex-wrap:wrap;font-size:9.5px;color:var(--txt-2);
  padding:9px 14px;background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r-sm);
}
.legend-strip i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-left:5px;}
.filter-bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;}
.filter-bar .inp{height:36px;width:220px;}

/* network svg animation */
.n-pulse{animation:pulseGlow 2.6s ease-in-out infinite;}
@keyframes pulseGlow{0%,100%{opacity:.35}50%{opacity:.95}}
.dash-offset{stroke-dasharray:4 7;animation:dashMove 1.6s linear infinite;}
@keyframes dashMove{to{stroke-dashoffset:-22;}}
.fade-in{animation:fadeUp .35s ease;}

/* responsive */
@media (max-width:980px){
  #sidebar{position:fixed;right:-100%;transition:.28s;height:100vh;}
  #sidebar.open{right:0;}
  #sidebar .brand{padding-top:14px;}
  .burger{display:flex !important;}
}
.burger{display:none;}
@media (max-width:640px){
  .search-rows{grid-template-columns:1fr;}
  .hero{flex-direction:column;align-items:flex-start;}
  .hero-net{display:none;}
}

/* ============ SHEET CATEGORIES ============ */
.cat-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px;}
.cat-tile{
  position:relative;overflow:hidden;cursor:pointer;border-radius:14px;padding:15px 15px 13px;
  border:1px solid var(--stroke);transition:.2s;background:var(--glass);
}
.cat-tile:hover{transform:translateY(-3px);border-color:var(--stroke-2);box-shadow:var(--shadow-1);}
.cat-tile .ct-ico{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  margin-bottom:10px;
}
.cat-tile .ct-ico svg{width:19px;height:19px;}
.cat-tile .ct-name{font-size:12px;font-weight:800;line-height:1.7;}
.cat-tile .ct-meta{font-size:9.5px;color:var(--txt-2);margin-top:3px;}
.cat-tile .ct-val{position:absolute;left:13px;top:13px;font-size:21px;font-weight:900;opacity:.9;font-family:var(--mono);}
.cat-tile .ct-ring{
  position:absolute;left:-26px;bottom:-26px;width:86px;height:86px;border-radius:50%;
  border:12px solid currentColor;opacity:.12;
}
.cat-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.cat-pill{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:.17s;
  background:var(--glass);border:1px solid var(--stroke);border-radius:12px;
  padding:8px 15px;font-size:11px;font-weight:700;color:var(--txt-1);position:relative;overflow:hidden;
}
.cat-pill:hover{transform:translateY(-2px);color:var(--txt-0);border-color:var(--stroke-2);}
.cat-pill.active{color:#fff;border-color:transparent;box-shadow:0 8px 20px -8px rgba(2,8,23,.7);}
.cat-pill .cp-ico{width:15px;height:15px;display:flex;align-items:center;}
.cat-pill .cp-ico svg{width:15px;height:15px;}
.cat-pill .cp-n{
  background:rgba(255,255,255,.16);border-radius:99px;padding:1.5px 9px;font-size:9px;font-family:var(--mono);
}
.cat-section{margin-bottom:22px;}
.cat-head{
  display:flex;align-items:center;gap:11px;padding:4px 3px 12px;
}
.cat-head .ch-ico{
  width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 34px;
}
.cat-head .ch-ico svg{width:17px;height:17px;}
.cat-head h3{margin:0;font-size:13.5px;font-weight:800;}
.cat-head .ch-sub{font-size:9.5px;color:var(--txt-2);font-weight:600;letter-spacing:.7px;}
.cat-head .ch-line{flex:1;height:1px;background:linear-gradient(90deg,var(--stroke),transparent);}
.cat-head .ch-n{
  font-family:var(--mono);font-size:10px;color:var(--txt-1);
  background:var(--glass);border:1px solid var(--stroke);border-radius:99px;padding:3px 12px;
}
.sheet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(218px,1fr));gap:11px;}
.sheet-card{
  background:linear-gradient(160deg,rgba(148,178,255,.07),rgba(148,178,255,.02));
  border:1px solid var(--stroke);border-radius:13px;padding:13px 14px;cursor:pointer;
  transition:.18s;position:relative;overflow:hidden;
}
.sheet-card:hover{transform:translateY(-3px);border-color:var(--stroke-2);box-shadow:var(--shadow-1);}
.sheet-card.active{border-color:rgba(34,211,238,.55);box-shadow:var(--glow-c);}
.sheet-card .sc-top{display:flex;align-items:center;gap:9px;}
.sheet-card .sc-dot{width:9px;height:9px;border-radius:3px;flex:0 0 9px;}
.sheet-card .sc-name{
  font-size:11.5px;font-weight:800;line-height:1.8;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.sheet-card .sc-rows{
  font-family:var(--mono);font-size:8.5px;color:var(--txt-2);
  background:rgba(2,10,27,.5);border:1px solid var(--stroke);border-radius:99px;padding:2px 9px;white-space:nowrap;
}
.sheet-card .sc-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;}
.sheet-card .sc-tag{
  font-size:8px;padding:2px 8px;border-radius:99px;font-weight:700;
  background:rgba(126,167,255,.1);color:#8ab6ff;border:1px solid rgba(126,167,255,.16);
}
.sheet-card .sc-glow{
  position:absolute;left:-30px;top:-30px;width:80px;height:80px;border-radius:50%;
  filter:blur(24px);opacity:.22;transition:.2s;
}
.sheet-card:hover .sc-glow{opacity:.4;}
.nav-group-head{
  grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:11px 4px 7px;
}
.nav-group-head .ng-ico{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
.nav-group-head .ng-ico svg{width:12px;height:12px;}
.nav-group-head .ng-t{font-size:11px;font-weight:800;}
.nav-group-head .ng-n{font-family:var(--mono);font-size:8.5px;color:var(--txt-2);}
.nav-group-head .ng-line{flex:1;height:1px;background:linear-gradient(90deg,var(--stroke),transparent);}

</style>
</head>
