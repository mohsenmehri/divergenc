# HTTPS reverse proxy for the FAM application (lab certificate).
# Port 80 only redirects; the application is served on 443.
# The small public login shell (login.html/css/js) is served statically here,
# exactly like IIS serves the www folder on Windows. Everything else is
# proxied to the application, which enforces its own session checks.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fam.crt;
    ssl_certificate_key /etc/nginx/certs/fam.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 32m;

    root /usr/share/nginx/html;

    location = / {
        try_files /login.html =404;
    }

    location / {
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://app:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
