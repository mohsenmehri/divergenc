[defaults]
inventory = inventory.ini
host_key_checking = True
gathering = explicit
fact_caching = memory
stdout_callback = fam_safe
callback_plugins = ./callback_plugins
cliconf_plugins = ./cliconf_plugins
terminal_plugins = ./terminal_plugins
retry_files_enabled = False
display_args_to_stdout = False
no_target_syslog = True
forks = 1

[persistent_connection]
connect_timeout = 10
command_timeout = 25
network_cli_retries = 1
log_messages = False

[libssh_connection]
host_key_auto_add = False
look_for_keys = False

[paramiko_connection]
# network_cli's own host-key-auto-add option is located in this section.
host_key_auto_add = False

[privilege_escalation]
become = False
